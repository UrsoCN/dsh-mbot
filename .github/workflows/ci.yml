name: CI

on:
  push:
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regression / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9.0', '24']
    env:
      GIT_AUTHOR_NAME: mbot-ci
      GIT_AUTHOR_EMAIL: mbot-ci@example.invalid
      GIT_COMMITTER_NAME: mbot-ci
      GIT_COMMITTER_EMAIL: mbot-ci@example.invalid
      DSH_TELEMETRY_MODE: DISABLED
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Types, serial Host/Runtime and Bash regression
        run: npm test 2>&1 | tee /tmp/mbot-regression.log
      - name: Preserve regression log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regression-node-${{ matrix.node }}
          path: /tmp/mbot-regression.log
          if-no-files-found: ignore
          retention-days: 14

  install:
    name: Install ${{ matrix.mode }} / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.9.0', '24']
        mode: [source, tarball, git, web-tarball]
    env:
      DSH_TELEMETRY_MODE: DISABLED
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies, tested DSH and pnpm
        run: |
          npm ci --ignore-scripts
          npm install --global --ignore-scripts @deepseek-ai/dsh@0.2.2-rc.5 pnpm@12.23.0
      - name: Install, run and remove plugin in isolated profile
        run: npm run test:install -- "${{ matrix.mode }}" 2>&1 | tee /tmp/mbot-install.log
      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: install-${{ matrix.mode }}-node-${{ matrix.node }}
          path: |
            /tmp/mbot-install.log
            /tmp/mbot-plugin-install.*/*.log
            /tmp/mbot-plugin-install.*/*.result.json
            /tmp/mbot-plugin-install.*/pack.json
          if-no-files-found: ignore
          retention-days: 14
